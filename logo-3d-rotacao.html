<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIBC Logotipo 3D — rotação no eixo Y</title>

<style>
  /* ============================================================
     VARIÁVEIS DE CONTROLE
     Ajuste tudo por aqui, sem mexer no @keyframes.
     ============================================================ */
  :root {
    --giro: 3s;        /* duração de UMA volta completa      */
    --pausa: 300s;      /* tempo parado entre as voltas       */
    --ciclo: 303s;      /* --giro + --pausa (some manualmente)*/
    --logo-largura: min(60vw, 320px);
    --perspectiva: 900px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;          /* centraliza vertical e horizontalmente */
    background: #14161a;
    padding: 24px;
  }

  /* ============================================================
     CONTAINER — dono da PERSPECTIVA
     A perspective precisa ficar no ELEMENTO PAI do que gira.
     Valor menor = distorção 3D mais dramática (câmera perto).
     Valor maior  = giro mais discreto (câmera longe).
     ============================================================ */
  .palco-logo {
    perspective: var(--perspectiva);
    perspective-origin: 50% 50%;
    transform-style: preserve-3d;
  }

  /* ============================================================
     O LOGOTIPO — o elemento que gira
     ============================================================ */
  .palco-logo img {
    display: block;
    width: var(--logo-largura);
    height: auto;

    transform-style: preserve-3d;   /* mantém o contexto 3D, evita achatamento */
    transform-origin: 50% 50%;      /* eixo de giro no centro da imagem        */
    will-change: transform;         /* dica de aceleração por GPU              */

    /* backface-visibility:
       - visible (padrão): o verso aparece espelhado durante metade do giro.
       - hidden: o logo "some" entre 90° e 270°, como uma folha de papel real.
       Para ocultar o verso, descomente a linha abaixo: */
    /* backface-visibility: hidden; */
    backface-visibility: visible;

    animation: girarEixoY var(--ciclo) linear infinite;
  }

  /* ============================================================
     KEYFRAMES
     O truque do "gira → espera → gira" está nas porcentagens:
     3s de giro dentro de um ciclo de 303s = 0.99% da timeline.
     Os 99.01% restantes ficam travados em 360deg (a pausa).
     ============================================================ */
  @keyframes girarEixoY {
    0%       { transform: rotateY(0deg); }
    0.99%  { transform: rotateY(360deg); }  /* fim do giro (3s de 303s) */
    100%     { transform: rotateY(360deg); }  /* pausa de 15s parado     */
  }

  /* Acessibilidade: respeita quem desativou animações no sistema */
  @media (prefers-reduced-motion: reduce) {
    .palco-logo img { animation: none; }
  }
</style>
</head>
